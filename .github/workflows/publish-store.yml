name: Publish Mobile Store Releases

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS submit profile
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
      submit_ios:
        description: Submit iOS
        required: true
        default: true
        type: boolean
      submit_android:
        description: Submit Android
        required: true
        default: true
        type: boolean
      ios_build_id:
        description: Optional explicit iOS EAS build ID (defaults to the latest finished build for the profile)
        required: false
        type: string
      android_build_id:
        description: Optional explicit Android EAS build ID (defaults to the latest finished build for the profile)
        required: false
        type: string
  workflow_call:
    inputs:
      profile:
        required: false
        default: production
        type: string
      submit_ios:
        required: false
        default: true
        type: boolean
      submit_android:
        required: false
        default: true
        type: boolean
      ios_build_id:
        required: false
        default: ''
        type: string
      android_build_id:
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-publish-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  submit-ios:
    name: Submit iOS (App Store Connect)
    if: ${{ inputs.submit_ios }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ASC_APP_ID: ${{ secrets.APPLE_ASC_APP_ID }}
      EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
      EAS_PROFILE: ${{ inputs.profile }}
      REQUESTED_BUILD_ID: ${{ inputs.ios_build_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure mobile release files
        run: |
          if [ ! -f eas.json ]; then
            echo "eas.json not found — this workflow must run from the mobile branch or a mobile tag."
            echo "Re-run it and pick 'mobile' (or a release tag) in the Run workflow ref dropdown."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify submit secrets
        run: |
          for key in EXPO_TOKEN EAS_PROJECT_ID APPLE_ID APPLE_TEAM_ID APPLE_ASC_APP_ID EXPO_APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "Missing secret: $key"
              exit 1
            fi
          done

      - name: Link EAS project
        run: |
          npx --yes eas-cli project:init --id "$EAS_PROJECT_ID" --force --non-interactive

      - name: Resolve iOS build ID
        id: resolve
        run: |
          set -euo pipefail
          build_id="$REQUESTED_BUILD_ID"
          if [ -z "$build_id" ]; then
            npx --yes eas-cli build:list --platform ios --status finished --limit 25 --non-interactive --json > ios-builds.json
            build_id="$(jq -r --arg p "$EAS_PROFILE" '[.[] | select(.buildProfile == $p)][0].id // empty' ios-builds.json)"
            if [ -z "$build_id" ]; then
              echo "No finished iOS build found for profile \"$EAS_PROFILE\". Run the build workflow first or pass ios_build_id."
              exit 1
            fi
            app_version="$(jq -r --arg p "$EAS_PROFILE" '[.[] | select(.buildProfile == $p)][0].appVersion // "?"' ios-builds.json)"
            echo "Resolved latest finished iOS build: $build_id (version $app_version)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Inject iOS submit config
        run: |
          node -e '
            const fs = require("fs")
            const profile = process.env.EAS_PROFILE
            const appleId = process.env.APPLE_ID
            const appleTeamId = process.env.APPLE_TEAM_ID
            const ascAppId = process.env.APPLE_ASC_APP_ID
            const easPath = "eas.json"
            const eas = JSON.parse(fs.readFileSync(easPath, "utf8"))
            eas.submit = eas.submit || {}
            eas.submit[profile] = eas.submit[profile] || {}
            eas.submit[profile].ios = Object.assign({}, eas.submit[profile].ios, {
              appleId,
              appleTeamId,
              ascAppId
            })
            fs.writeFileSync(easPath, JSON.stringify(eas, null, 2) + "\n")
          '

      - name: Submit specific iOS build
        env:
          IOS_BUILD_ID: ${{ steps.resolve.outputs.build_id }}
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          if npx --yes eas-cli submit --platform ios --profile "$EAS_PROFILE" --id "$IOS_BUILD_ID" --non-interactive 2>&1 | tee "$log_file"; then
            exit 0
          fi
          if grep -qi "already submitted this version of the app" "$log_file"; then
            echo "iOS build/version already submitted; treating as successful publish."
            exit 0
          fi
          exit 1

  submit-android:
    name: Submit Android (Play Console)
    if: ${{ inputs.submit_android }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      EAS_PROFILE: ${{ inputs.profile }}
      REQUESTED_BUILD_ID: ${{ inputs.android_build_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure mobile release files
        run: |
          if [ ! -f eas.json ]; then
            echo "eas.json not found — this workflow must run from the mobile branch or a mobile tag."
            echo "Re-run it and pick 'mobile' (or a release tag) in the Run workflow ref dropdown."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify submit secrets
        run: |
          for key in EXPO_TOKEN EAS_PROJECT_ID GOOGLE_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!key:-}" ]; then
              echo "Missing secret: $key"
              exit 1
            fi
          done

      - name: Link EAS project
        run: |
          npx --yes eas-cli project:init --id "$EAS_PROJECT_ID" --force --non-interactive

      - name: Resolve Android build ID
        id: resolve
        run: |
          set -euo pipefail
          build_id="$REQUESTED_BUILD_ID"
          if [ -z "$build_id" ]; then
            npx --yes eas-cli build:list --platform android --status finished --limit 25 --non-interactive --json > android-builds.json
            build_id="$(jq -r --arg p "$EAS_PROFILE" '[.[] | select(.buildProfile == $p)][0].id // empty' android-builds.json)"
            if [ -z "$build_id" ]; then
              echo "No finished Android build found for profile \"$EAS_PROFILE\". Run the build workflow first or pass android_build_id."
              exit 1
            fi
            app_version="$(jq -r --arg p "$EAS_PROFILE" '[.[] | select(.buildProfile == $p)][0].appVersion // "?"' android-builds.json)"
            echo "Resolved latest finished Android build: $build_id (version $app_version)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Write Google service account key
        run: |
          key_file="$RUNNER_TEMP/google-play-service-account.json"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$key_file"
          echo "GOOGLE_KEY_PATH=$key_file" >> "$GITHUB_ENV"

      - name: Inject Android submit config
        run: |
          node -e '
            const fs = require("fs")
            const profile = process.env.EAS_PROFILE
            const keyPath = process.env.GOOGLE_KEY_PATH
            const easPath = "eas.json"
            const eas = JSON.parse(fs.readFileSync(easPath, "utf8"))
            eas.submit = eas.submit || {}
            eas.submit[profile] = eas.submit[profile] || {}
            eas.submit[profile].android = Object.assign({}, eas.submit[profile].android, {
              serviceAccountKeyPath: keyPath
            })
            fs.writeFileSync(easPath, JSON.stringify(eas, null, 2) + "\n")
          '

      - name: Submit specific Android build
        env:
          ANDROID_BUILD_ID: ${{ steps.resolve.outputs.build_id }}
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          if npx --yes eas-cli submit --platform android --profile "$EAS_PROFILE" --id "$ANDROID_BUILD_ID" --non-interactive 2>&1 | tee "$log_file"; then
            exit 0
          fi

          if grep -q "Google Play Android Developer API has not been used in project" "$log_file"; then
            echo "Google Play Android Developer API is disabled in the GCP project used by GOOGLE_SERVICE_ACCOUNT_JSON."
            echo "Enable androidpublisher.googleapis.com in that exact GCP project and retry:"
            echo "https://console.developers.google.com/apis/api/androidpublisher.googleapis.com/overview?project=<your-project-id>"
          fi
          exit 1
